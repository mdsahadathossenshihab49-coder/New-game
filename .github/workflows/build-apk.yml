name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔐 Ensure Debug Keystore & Environment Exist
        run: |
          touch .env
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating debug.keystore..."
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: 🔑 Grant Execution Permissions to Gradle Wrapper
        run: |
          chmod +x gradlew

      - name: 🔨 Compile Android Native APK (assembleDebug)
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🔍 Locate Generated Debug APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📤 Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberRelics-Match-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: 📦 Prepare APK for GitHub Release
        id: prep_apk
        run: |
          mkdir -p release_bin
          cp "${{ steps.find_apk.outputs.apk_path }}" release_bin/CyberRelics-Match.apk
          echo "release_file=release_bin/CyberRelics-Match.apk" >> $GITHUB_OUTPUT

      - name: 🚀 Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "CyberRelics Match APK (Build #${{ github.run_number }})"
          body: |
            ### 📱 CyberRelics Match Android APK

            আপনার অ্যান্ড্রয়েড ফোনে সরাসরি ডাউনলোড ও ইনস্টল করতে নিচের `CyberRelics-Match.apk` ফাইলে ট্যাপ করুন:
            - **File:** `CyberRelics-Match.apk`
            - **Status:** Ready for Install
          draft: false
          prerelease: false
          files: release_bin/CyberRelics-Match.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
